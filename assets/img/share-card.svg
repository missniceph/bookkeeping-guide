<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" width="1200" height="630">
  <!-- Social share preview (source). The PNG next to it (share-card.png) is what Facebook/Messenger/X show. -->
  <rect width="1200" height="630" fill="#fffaf2"/>
  <rect x="0" y="0" width="1200" height="14" fill="#0d7068"/>
  <circle cx="1090" cy="560" r="230" fill="#dcf2ee"/>
  <circle cx="1130" cy="80" r="90" fill="#fff0cc"/>

  <g font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif">
    <text x="80" y="128" font-size="30" font-weight="700" fill="#0d7068" letter-spacing="2">NICE TO KNOW · @MISSNICEPH</text>
    <text x="80" y="228" font-size="82" font-weight="800" fill="#1f2430">Bookkeeping for</text>
    <text x="80" y="318" font-size="82" font-weight="800" fill="#1f2430">First-Timers</text>
    <text x="80" y="390" font-size="34" fill="#4a5060">A friendly guide to BIR books of accounts</text>
    <text x="80" y="436" font-size="34" fill="#4a5060">for freelancers and small business owners</text>
    <g font-size="28" font-weight="800">
      <rect x="80" y="486" width="96" height="54" rx="27" fill="#0d7068"/>
      <text x="128" y="523" text-anchor="middle" fill="#ffffff">EN</text>
      <rect x="190" y="486" width="110" height="54" rx="27" fill="none" stroke="#0d7068" stroke-width="4"/>
      <text x="245" y="523" text-anchor="middle" fill="#0d7068">FIL</text>
      <text x="324" y="523" font-weight="600" fill="#4a5060">Free · practice lab · checklists</text>
    </g>
  </g>

  <!-- open notebook, coins and a check mark -->
  <g transform="translate(790 170) scale(1.25)">
    <ellipse cx="150" cy="200" rx="120" ry="12" fill="#f0e2c8"/>
    <path d="M40 50 Q95 35 150 55 L150 190 Q95 172 40 186 Z" fill="#ffffff" stroke="#0d7068" stroke-width="5" stroke-linejoin="round"/>
    <path d="M260 50 Q205 35 150 55 L150 190 Q205 172 260 186 Z" fill="#ffffff" stroke="#0d7068" stroke-width="5" stroke-linejoin="round"/>
    <g stroke="#eadfcd" stroke-width="5" stroke-linecap="round" fill="none">
      <path d="M60 80 Q95 72 132 84"/><path d="M60 102 Q95 94 132 106"/><path d="M60 124 Q95 116 132 128"/>
      <path d="M168 84 Q205 72 240 80"/><path d="M168 106 Q205 94 240 102"/>
    </g>
    <ellipse cx="236" cy="176" rx="30" ry="10" fill="#f2b53a"/>
    <rect x="206" y="160" width="60" height="16" fill="#f2b53a"/>
    <ellipse cx="236" cy="160" rx="30" ry="10" fill="#f8d27e" stroke="#f2b53a" stroke-width="3"/>
    <circle cx="70" cy="44" r="28" fill="#1b7a3a"/>
    <path d="M57 44 l10 10 17-19" fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
